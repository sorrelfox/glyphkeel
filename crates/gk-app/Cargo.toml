[package]
name = "gk-app"
description = "The Glyphkeel desktop app: a Tauri program that hosts the engine and the web UI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "glyphkeel-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
gk-api = { workspace = true }
gk-engine = { workspace = true }
# The workspace folder's layout and the change watcher's handle.
gk-store = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { workspace = true }

# The web view's settings are tightened through WebKitGTK directly.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { workspace = true, features = ["v2_40"] }
gtk = { workspace = true }
zbus = { workspace = true }

[dev-dependencies]
schemars = { workspace = true }
tempfile = { workspace = true }
# Tauri's mock runtime, to call the commands the way the page does.
tauri = { workspace = true, features = ["test"] }

[lints]
workspace = true
