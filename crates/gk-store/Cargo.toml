[package]
name = "gk-store"
description = "Glyphkeel's storage: the SQLite schema, migrations and repositories."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
directories = { workspace = true }
gk-core = { workspace = true }
# The salt of a stored passphrase check (the app lock).
getrandom = { workspace = true }
icu_collator = { workspace = true }
# The key of an encrypted workspace from its passphrase, as SQLCipher
# derives it.
pbkdf2 = { workspace = true }
# The personal settings file.
serde = { workspace = true }
serde_json = { workspace = true }
# Content hashes of stored files.
sha2 = { workspace = true }
# Stored files of an encrypted workspace, and encrypted exports.
chacha20poly1305 = { workspace = true }
hkdf = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
zeroize = { workspace = true }

# SQLite: SQLCipher's build, on every system. Its cryptography is the
# system's OpenSSL on Linux and LibTomCrypt on Windows (see build.rs). The
# program still checks at run time that it can encrypt.
rusqlite = { workspace = true, features = ["bundled-sqlcipher"] }

[build-dependencies]
# LibTomCrypt for the Windows build: its source comes with SQLCipher's
# (already a build dependency of libsqlite3-sys), compiled with cc.
cc = { workspace = true }
sqlcipher-src = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

