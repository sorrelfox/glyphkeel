[package]
name = "gk-engine"
description = "Glyphkeel's engine: workspaces, operations, history, events, files and jobs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
gk-api = { workspace = true }
gk-core = { workspace = true }
gk-markdown = { workspace = true }
gk-query = { workspace = true }
gk-store = { workspace = true }
icu_calendar = { workspace = true }
icu_datetime = { workspace = true }
icu_decimal = { workspace = true }
icu_locale_core = { workspace = true }
icu_plurals = { workspace = true }
image = { workspace = true }
jiff = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_path_to_error = { workspace = true }
tracing = { workspace = true }
zip = { workspace = true }

# The person's language on Windows (the Desktop key's preferred UI languages).
[target.'cfg(windows)'.dependencies]
winreg = { workspace = true }

[dev-dependencies]
gk-seed = { workspace = true }
insta = { workspace = true }
schemars = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
