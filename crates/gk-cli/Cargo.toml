[package]
name = "gk-cli"
description = "The `glyphkeel` command line, which also serves MCP."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# A lean console program: it must never link the desktop app's toolkit or the
# web view (`cargo xtask check-deps` enforces this).
[[bin]]
name = "glyphkeel"
path = "src/main.rs"

[build-dependencies]
embed-resource = { workspace = true }

[dependencies]
clap = { workspace = true, features = ["string"] }
clap_complete = { workspace = true }
clap_mangen = { workspace = true }
gk-api = { workspace = true }
gk-engine = { workspace = true }
gk-mcp = { workspace = true }
# Only for the workspace folder layout the engine opens.
gk-store = { workspace = true }
# Asking for a workspace's passphrase on the terminal without echo.
rpassword = { workspace = true }
serde_json = { workspace = true }
# Wiping a passphrase read from standard input.
zeroize = { workspace = true }

[dev-dependencies]
gk-seed = { workspace = true }
insta = { workspace = true, features = ["filters", "json", "redactions"] }
tempfile = { workspace = true }

[lints]
workspace = true
