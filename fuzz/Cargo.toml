# Fuzz targets, run with cargo-fuzz on a nightly toolchain:
#
#     cargo +nightly fuzz run query_parse -- -max_total_time=60
#
# Kept out of the main workspace: it needs nightly and libFuzzer, and nothing
# that ships depends on it.

[package]
name = "gk-fuzz"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
gk-query = { path = "../crates/gk-query" }
libfuzzer-sys = "0.4.12"

[[bin]]
name = "query_parse"
path = "fuzz_targets/query_parse.rs"
test = false
doc = false
bench = false

# Its own workspace, apart from the main one.
[workspace]
