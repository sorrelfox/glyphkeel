# SPDX-License-Identifier: GPL-3.0-or-later
# Copyright (C) 2026 Glyphkeel contributors
#
# The licence policy of everything Glyphkeel ships, and the extra entries of
# THIRD-PARTY-NOTICES.txt. `cargo xtask notices` writes the notices from the
# lock files and this file; `cargo xtask notices --check` (part of the static
# checks) fails when the notices are out of date or when a shipped crate, npm
# package or component has a licence this file doesn't allow.
#
# cargo-deny checks the crates' licences as well, with its own copy of the
# list in the `[licenses]` section of deny.toml. The check here fails when
# the two `allow` lists differ, so change both together.
#
# Every exception, override and component needs a reason.

# Licences compatible with distributing Glyphkeel under GPL-3.0-or-later. An
# expression with OR passes when one choice is allowed, one with AND when
# every part is.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "0BSD",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
    "LGPL-2.1-or-later",
    "LGPL-3.0-only",
    "LGPL-3.0-or-later",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "Unlicense",
    "BSL-1.0",
    # Fonts only.
    "OFL-1.1",
]

# One more licence for one package. `kind` is "crate", "npm" or "component".
[[exception]]
kind = "crate"
name = "finl_unicode"
allow = ["Unicode-DFS-2016"]
reason = """
Unicode character categories for the Markdown parser. Its data tables are \
under the older Unicode licence, a permissive licence compatible with the GPL.\
"""

[[exception]]
kind = "crate"
name = "sqlcipher-src"
allow = ["blessing", "WTFPL"]
reason = """
The SQLCipher source the encrypted workspaces are built from. Its SQLite \
part is in the public domain (the blessing is not a licence condition), and \
its LibTomCrypt part is public domain or WTFPL, at the user's choice; both \
are compatible with the GPL. The Linux builds use the system's OpenSSL; \
the Windows build compiles its LibTomCrypt (listed as a component).\
"""

[[exception]]
kind = "component"
name = "LibTomCrypt"
allow = ["WTFPL"]
reason = """
SQLCipher's cryptography in the Windows build. It is public domain or WTFPL, \
at the user's choice; both are compatible with the GPL.\
"""

[[exception]]
kind = "component"
name = "SQLite"
allow = ["blessing"]
reason = "SQLite is in the public domain; the blessing is not a licence condition."

[[exception]]
kind = "component"
name = "NSIS"
allow = ["CPL-1.0"]
reason = """
The LZMA decompressor in the Windows installer's stub. The installer is a \
separate program that unpacks Glyphkeel, not linked with it, and the module's \
authors expressly permit linking to it without the Common Public License \
applying to the linked code.\
"""

[[exception]]
kind = "component"
name = "Microsoft Edge WebView2 bootstrapper"
allow = ["LicenseRef-Microsoft-WebView2"]
reason = """
A separate Microsoft program carried by the Windows installer, which runs it \
to install the web view when Windows lacks it. It is not linked with \
Glyphkeel: aggregation, which the GPL allows.\
"""

# A licence for a package whose metadata names none or names it wrongly. The
# package's own licence file was read to decide.
[[override]]
kind = "npm"
name = "khroma"
licence = "MIT"
reason = "package.json has no licence field; its `license` file is the MIT licence."

# Packages from the UI's development dependencies whose code ends up in the
# built interface anyway: the bundler's own helpers. `path` is the installed
# package, relative to the repository.
[[bundled]]
name = "vite"
path = "ui/node_modules/vite"
reason = "the module preload helper in the built interface"

[[bundled]]
name = "rolldown"
path = "node_modules/.pnpm/node_modules/rolldown"
reason = "the runtime helpers of the bundled modules"

# Parts that are not crates or npm packages. `texts` are files in the
# repository; `copyright` is shown with them.
[[component]]
name = "The Rust standard library"
licence = "MIT OR Apache-2.0"
source = "https://github.com/rust-lang/rust"
used = "Compiled into both programs."
copyright = "The Rust Project Developers"
texts = ["xtask/licences/MIT.txt", "xtask/licences/Apache-2.0.txt"]

[[component]]
name = "SQLite"
licence = "blessing"
source = "https://sqlite.org/"
used = "The database engine, compiled into both programs by the libsqlite3-sys crate."
note = """
The author disclaims copyright to this source code. In place of a legal \
notice, here is a blessing:

    May you do good and not evil.
    May you find forgiveness for yourself and forgive others.
    May you share freely, never taking more than you give.\
"""

[[component]]
name = "SQLCipher"
licence = "BSD-3-Clause"
source = "https://www.zetetic.net/sqlcipher/"
used = "SQLite with encryption, for encrypted workspaces: compiled into both programs by the libsqlite3-sys crate (from sqlcipher-src), linked with the system's OpenSSL on Linux and with LibTomCrypt on Windows."
copyright = "ZETETIC LLC"
texts = ["xtask/licences/BSD-3-Clause.txt"]

[[component]]
name = "LibTomCrypt"
licence = "WTFPL"
source = "https://github.com/libtom/libtomcrypt"
used = "The cryptography of encrypted workspaces in the Windows build (AES, SHA-1, SHA-256, SHA-512, HMAC, PBKDF2 and a random generator for SQLCipher), compiled into both programs from the source in sqlcipher-src. It is public domain or WTFPL, at the user's choice."
copyright = "Tom St Denis and the LibTomCrypt contributors"
texts = ["third_party/libtomcrypt/LICENSE"]

[[component]]
name = "KaTeX fonts"
licence = "OFL-1.1"
source = "https://github.com/KaTeX/katex-fonts"
used = """
The math fonts in the app's interface, which come with the katex package \
(listed with the JavaScript packages). The fonts carry their own licence in \
their metadata: the SIL Open Font License, with the Reserved Font Names \
KaTeX_AMS, KaTeX_Caligraphic, KaTeX_Fraktur, KaTeX_Main, KaTeX_Math, \
KaTeX_SansSerif, KaTeX_Script, KaTeX_Size1 to KaTeX_Size4 and \
KaTeX_Typewriter.\
"""
copyright = "2009-2010 Design Science, Inc. (www.mathjax.org); 2014-2018 Khan Academy (www.khanacademy.org)"
texts = ["xtask/licences/OFL-1.1.txt"]

[[component]]
name = "TextMate grammars"
licence = "MIT AND Apache-2.0 AND Apache-2.0 WITH LLVM-exception AND BSD-2-Clause AND BSD-3-Clause AND ISC AND MPL-2.0 AND GPL-3.0-only AND LGPL-3.0-only"
source = "https://github.com/shikijs/textmate-grammars-themes"
used = """
The grammars of code highlighting, which come with the @shikijs/langs package \
(listed with the JavaScript packages), built from the tm-grammars package. \
Each grammar comes from its own project, under that project's licence. The \
tm-grammars notice, with every grammar's source, licence and licence text, \
and the licence of tm-grammars itself are reproduced below.\
"""
copyright = "2021 Pine Wu, 2023 Anthony Fu (tm-grammars); each grammar's authors, as its notice says"
texts = ["third_party/tm-grammars/LICENSE", "third_party/tm-grammars/NOTICE"]

[[component]]
name = "NSIS"
licence = "Zlib AND CPL-1.0"
source = "https://nsis.sourceforge.io/"
used = """
The Windows installer and uninstaller are made with it and contain its code: \
the installer stub under the zlib licence, and the LZMA decompressor of its \
LZMA compression module under the Common Public License with the module \
authors' special exception. Its licence file is reproduced below.\
"""
copyright = "1999-2026 NSIS contributors"
texts = ["third_party/nsis/COPYING"]

[[component]]
name = "nsis_tauri_utils"
licence = "MIT OR Apache-2.0"
source = "https://github.com/tauri-apps/nsis-tauri-utils"
used = "An NSIS plug-in that the Windows installer and uninstaller carry, from the Tauri bundler."
copyright = "2019-2022 Tauri Programme within The Commons Conservancy"
texts = ["xtask/licences/MIT.txt", "xtask/licences/Apache-2.0.txt"]

[[component]]
name = "Microsoft Edge WebView2 bootstrapper"
licence = "LicenseRef-Microsoft-WebView2"
source = "https://developer.microsoft.com/microsoft-edge/webview2/"
used = "Carried by the Windows installer, which runs it to install the web view when Windows lacks it."
note = """
A separate program by Microsoft Corporation, distributed under Microsoft's \
licence terms for the WebView2 Runtime. It is not part of Glyphkeel and is \
not covered by Glyphkeel's licence.\
"""
