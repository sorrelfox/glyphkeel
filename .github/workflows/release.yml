# SPDX-License-Identifier: GPL-3.0-or-later
# Copyright (C) 2026 Glyphkeel contributors
#
# Promotes a passed pre-release to a final release. It builds nothing.
#
# Pushing a release tag such as v0.1.0 starts it. The tag must point at the
# same commit as a published pre-release of that version (v0.1.0-rc.N).
# prerelease.yml publishes a pre-release only after every check has passed,
# so its existence is the proof. This workflow downloads that pre-release's
# files, checks their checksums and attestations, and publishes the same
# files, byte for byte, as the release. If the code changed after the last
# pre-release, make a new pre-release first.
#
# Then it publishes the package repositories on GitHub Pages:
# - /flatpak/: the pre-release's Flatpak bundle, imported unchanged into an
#   OSTree repository and signed with the key in the FLATPAK_GPG_PRIVATE_KEY
#   secret;
# - /apt/ and /rpm/: APT and DNF repositories of the pre-release's deb and
#   rpm, made by `cargo xtask repos` and signed with the key in the
#   PACKAGES_GPG_PRIVATE_KEY secret.
# Without a secret the release is still published and that repository is
# left out, with a warning. docs/releasing.md has the one-time set-up.

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  promote:
    name: Publish the release from its pre-release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      attestations: read
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Find the pre-release on this commit
        id: find
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$TAG is not a release tag (expected vX.Y.Z)"
            exit 1
          fi
          found=""
          while read -r candidate; do
            if [[ "$(git rev-parse "$candidate^{commit}")" == "$GITHUB_SHA" ]]; then
              found="$candidate"
            fi
          done < <(gh release list --limit 200 --exclude-drafts --json tagName,isPrerelease \
                     --jq '.[] | select(.isPrerelease and (.tagName | startswith(env.TAG + "-"))) | .tagName' \
                   | grep -E -- '-(alpha|beta|rc)\.[0-9]+$' | sort -V)
          if [[ -z "$found" ]]; then
            echo "::error::No published pre-release of $TAG points at $GITHUB_SHA. Push a pre-release tag for this commit and wait for it to pass."
            exit 1
          fi
          echo "Promoting $found"
          echo "prerelease=$found" >> "$GITHUB_OUTPUT"

      - name: Download and check its files
        env:
          PRERELEASE: ${{ steps.find.outputs.prerelease }}
        run: |
          mkdir "$RUNNER_TEMP/assets"
          gh release download "$PRERELEASE" --dir "$RUNNER_TEMP/assets"
          cd "$RUNNER_TEMP/assets"
          sha256sum --check --strict SHA256SUMS
          # Every file listed, plus SHA256SUMS itself, must be in the release.
          listed=$(awk '{ print $2 }' SHA256SUMS | sort)
          present=$(find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort)
          if [[ "$listed" != "$present" ]]; then
            echo "::error::The pre-release's files don't match its SHA256SUMS"
            exit 1
          fi
          while read -r file; do
            gh attestation verify "$file" \
              --repo "$GH_REPO" \
              --signer-workflow "$GH_REPO/.github/workflows/prerelease.yml"
          done <<< "$listed"

      - name: Publish the release
        env:
          PRERELEASE: ${{ steps.find.outputs.prerelease }}
        run: |
          gh release view "$PRERELEASE" --json body --jq .body > "$RUNNER_TEMP/notes.md"
          printf '\n\nThese are the files of %s, unchanged.\n' "$PRERELEASE" >> "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" \
            --verify-tag \
            --latest \
            --title "Glyphkeel $TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "$RUNNER_TEMP"/assets/*

  site:
    name: Sign the package repositories
    needs: promote
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      attestations: read
    outputs:
      publish: ${{ steps.key.outputs.publish }}
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      APP_ID: io.github.sorrelfox.Glyphkeel
      # Where GitHub Pages serves the repositories. The .flatpakref and
      # .flatpakrepo in crates/gk-app/packaging/flatpak/ name the same place.
      SITE_URL: https://sorrelfox.github.io/glyphkeel
      FLATPAK_DIR: crates/gk-app/packaging/flatpak
    steps:
      # An unsigned repository is never published. Without a key the release
      # stands as it is (its files are already published), so a repository
      # whose key is missing is left out with a warning rather than failing
      # the run. A Pages deployment replaces the whole site, so a repository
      # left out disappears from it until a release has its key again.
      - name: Check for the signing keys
        id: key
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          PACKAGES_GPG_PRIVATE_KEY: ${{ secrets.PACKAGES_GPG_PRIVATE_KEY }}
        run: |
          missing() {
            echo "::warning title=$1 not published::The repository secret $2 is not set, so the $1 is not on GitHub Pages. The release and its files are published. docs/releasing.md says how to add the key."
            {
              echo "### $1 not published"
              echo
              echo "The repository secret \`$2\` is not set. The release and its files are published; the signed $1 on GitHub Pages is not. See \`docs/releasing.md\`."
            } >> "$GITHUB_STEP_SUMMARY"
          }
          flatpak=true
          packages=true
          [[ -n "$FLATPAK_GPG_PRIVATE_KEY" ]] || { flatpak=false; missing "Flatpak repository" FLATPAK_GPG_PRIVATE_KEY; }
          [[ -n "$PACKAGES_GPG_PRIVATE_KEY" ]] || { packages=false; missing "APT and DNF repositories" PACKAGES_GPG_PRIVATE_KEY; }
          publish=false
          if [[ "$flatpak" == true || "$packages" == true ]]; then publish=true; fi
          {
            echo "flatpak=$flatpak"
            echo "packages=$packages"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.key.outputs.publish == 'true'
        with:
          persist-credentials: false

      # The site: the project's website from site/ when the repository has
      # one (a Pages deployment replaces the whole site, so the website must
      # travel with it), else a short start page. The repositories follow.
      - name: Start the site
        if: steps.key.outputs.publish == 'true'
        run: |
          site="$RUNNER_TEMP/site"
          mkdir -p "$site"
          if [[ -d site ]]; then
            cp -R site/. "$site/"
          else
            cat > "$site/index.html" <<'HTML'
          <!doctype html>
          <html lang="en">
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Glyphkeel</title>
          <h1>Glyphkeel</h1>
          <p>A task manager whose data stays on this computer.</p>
          <ul>
            <li><a href="https://github.com/sorrelfox/glyphkeel">Source code</a></li>
            <li><a href="https://github.com/sorrelfox/glyphkeel/releases">Releases</a></li>
            <li><a href="https://github.com/sorrelfox/glyphkeel/blob/main/docs/guide/getting-started.md">Installing</a></li>
            <li><a href="flatpak/io.github.sorrelfox.Glyphkeel.flatpakref">Install the Flatpak</a></li>
          </ul>
          </html>
          HTML
          fi

      - name: Install flatpak and ostree
        if: steps.key.outputs.flatpak == 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends flatpak ostree

      # The bundle the pre-release built, from this release, checked against
      # the release's SHA256SUMS and its build-provenance attestation.
      - name: Download and check the bundle
        if: steps.key.outputs.flatpak == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          gh release download "$TAG" --dir "$RUNNER_TEMP/release" --pattern '*.flatpak' --pattern SHA256SUMS --clobber
          cd "$RUNNER_TEMP/release"
          shopt -s nullglob
          bundles=(*.flatpak)
          if [[ ${#bundles[@]} -ne 1 ]]; then
            echo "::error::The release $TAG should have exactly one Flatpak bundle; it has ${#bundles[@]}"
            exit 1
          fi
          grep -F -- " ${bundles[0]}" SHA256SUMS | sha256sum --check --strict
          gh attestation verify "${bundles[0]}" \
            --repo "$GH_REPO" \
            --signer-workflow "$GH_REPO/.github/workflows/prerelease.yml"
          echo "BUNDLE=$RUNNER_TEMP/release/${bundles[0]}" >> "$GITHUB_ENV"

      # The secret is the private key, ASCII-armoured, with no passphrase:
      # the secret store is what protects it. Its public half is derived from
      # it, so there is nothing else to keep in step.
      - name: Import the Flatpak signing key
        if: steps.key.outputs.flatpak == 'true'
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s\n' "$FLATPAK_GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          key=$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')
          if [[ -z "$key" ]]; then
            echo "::error::FLATPAK_GPG_PRIVATE_KEY holds no private key. Store the output of 'gpg --armor --export-secret-keys KEY' in it."
            exit 1
          fi
          if ! echo check | gpg --batch --pinentry-mode error --local-user "$key" --sign > /dev/null; then
            echo "::error::The key in FLATPAK_GPG_PRIVATE_KEY can't sign without a passphrase. Store a copy of the key without one."
            exit 1
          fi
          gpg --batch --export "$key" > "$RUNNER_TEMP/glyphkeel.gpg"
          echo "Signing with $key"
          {
            echo "GNUPGHOME=$GNUPGHOME"
            echo "KEY_ID=$key"
          } >> "$GITHUB_ENV"

      - name: Build the signed Flatpak repository
        if: steps.key.outputs.flatpak == 'true'
        run: |
          site="$RUNNER_TEMP/site"
          mkdir -p "$site/flatpak"
          repo="$site/flatpak/repo"
          ostree --repo="$repo" init --mode=archive
          flatpak build-import-bundle --no-update-summary \
            --gpg-sign="$KEY_ID" --gpg-homedir="$GNUPGHOME" \
            "$repo" "$BUNDLE"
          flatpak build-update-repo \
            --title=Glyphkeel \
            --homepage="$SITE_URL/" \
            --default-branch=stable \
            --gpg-import="$RUNNER_TEMP/glyphkeel.gpg" \
            --gpg-sign="$KEY_ID" --gpg-homedir="$GNUPGHOME" \
            --generate-static-deltas \
            --prune \
            "$repo"
          rm -rf "${repo:?}/tmp" "$repo/.lock"
          mkdir "$repo/tmp"

          key=$(base64 --wrap=0 "$RUNNER_TEMP/glyphkeel.gpg")
          for file in io.github.sorrelfox.Glyphkeel.flatpakref glyphkeel.flatpakrepo; do
            { cat "$FLATPAK_DIR/$file"; echo "GPGKey=$key"; } > "$site/flatpak/$file"
          done
          cp "$RUNNER_TEMP/glyphkeel.gpg" "$site/flatpak/glyphkeel.gpg"
          cp crates/gk-app/icons/128x128.png "$site/flatpak/glyphkeel.png"

      # The repository as a client sees it: the summary and the commit
      # verify against the published key, and the ref is there.
      - name: Check the Flatpak repository with the published files
        if: steps.key.outputs.flatpak == 'true'
        run: |
          site="$RUNNER_TEMP/site"
          flatpak remote-add --user --gpg-import="$site/flatpak/glyphkeel.gpg" \
            glyphkeel-check "file://$site/flatpak/repo"
          flatpak remote-ls --user glyphkeel-check
          flatpak remote-info --user glyphkeel-check "app/$APP_ID/x86_64/stable"
          flatpak remote-delete --user glyphkeel-check
          rm -rf "$GNUPGHOME"

      # The APT and DNF repositories hold the release's deb and rpm, checked
      # like the bundle. `cargo xtask repos` signs the repositories' metadata
      # and the rpm's copy in the repository; the release's own files stay
      # as they are. Its key is a key of its own, in PACKAGES_GPG_PRIVATE_KEY.
      - name: Install the repository tools
        if: steps.key.outputs.packages == 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends apt-utils createrepo-c rpm gnupg
          rustup toolchain install

      - name: Download and check the deb and the rpm
        if: steps.key.outputs.packages == 'true'
        run: |
          dir="$RUNNER_TEMP/packages"
          mkdir -p "$dir"
          gh release download "$TAG" --dir "$dir" --pattern '*.deb' --pattern '*.rpm' --pattern SHA256SUMS
          cd "$dir"
          shopt -s nullglob
          debs=(*.deb)
          rpms=(*.rpm)
          if [[ ${#debs[@]} -ne 1 || ${#rpms[@]} -ne 1 ]]; then
            echo "::error::The release $TAG should have one deb and one rpm; it has ${#debs[@]} and ${#rpms[@]}"
            exit 1
          fi
          for file in "${debs[0]}" "${rpms[0]}"; do
            grep -F -- " $file" SHA256SUMS | sha256sum --check --strict
            gh attestation verify "$file" \
              --repo "$GH_REPO" \
              --signer-workflow "$GH_REPO/.github/workflows/prerelease.yml"
          done
          {
            echo "DEB=$dir/${debs[0]}"
            echo "RPM=$dir/${rpms[0]}"
          } >> "$GITHUB_ENV"

      - name: Build the signed APT and DNF repositories
        if: steps.key.outputs.packages == 'true'
        env:
          PACKAGES_GPG_PRIVATE_KEY: ${{ secrets.PACKAGES_GPG_PRIVATE_KEY }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg-packages"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s\n' "$PACKAGES_GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          if ! gpg --batch --list-secret-keys | grep -q '^sec'; then
            echo "::error::PACKAGES_GPG_PRIVATE_KEY holds no private key. Store the output of 'gpg --armor --export-secret-keys KEY' in it."
            exit 1
          fi
          cargo xtask repos --deb "$DEB" --rpm "$RPM" --out "$RUNNER_TEMP/site" --site-url "$SITE_URL"

      # The repositories as clients see them: apt's gpgv accepts the signed
      # Release file with the published key, and rpm accepts the package's
      # signature and the metadata's.
      - name: Check the APT and DNF repositories with the published files
        if: steps.key.outputs.packages == 'true'
        run: |
          site="$RUNNER_TEMP/site"
          gpgv --keyring "$site/apt/glyphkeel.gpg" "$site/apt/dists/stable/InRelease"
          gpgv --keyring "$site/apt/glyphkeel.gpg" \
            "$site/apt/dists/stable/Release.gpg" "$site/apt/dists/stable/Release"
          gpg --batch --dearmor < "$site/rpm/glyphkeel.asc" > "$RUNNER_TEMP/rpm-key.gpg"
          gpgv --keyring "$RUNNER_TEMP/rpm-key.gpg" \
            "$site/rpm/repodata/repomd.xml.asc" "$site/rpm/repodata/repomd.xml"
          rpmdb="$RUNNER_TEMP/rpmdb"
          mkdir -p "$rpmdb"
          rpmkeys --dbpath "$rpmdb" --import "$site/rpm/glyphkeel.asc"
          rpmkeys --dbpath "$rpmdb" --checksig "$site"/rpm/*.rpm
          rm -rf "$RUNNER_TEMP/gnupg-packages"

      - name: Size of the site
        if: steps.key.outputs.publish == 'true'
        run: du -sh "$RUNNER_TEMP/site"/*

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.key.outputs.publish == 'true'
        with:
          path: ${{ runner.temp }}/site

  pages:
    name: Publish the package repositories on GitHub Pages
    needs: site
    if: needs.site.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
