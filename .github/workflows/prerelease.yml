# Copyright (C) 2026 Glyphkeel contributors
#
# The only workflow that builds anything. It runs when a pre-release tag such
# as v0.1.0-rc.1 is pushed, and at no other time: everyday checks run on the
# developer's machine with `cargo xtask ci`, in the same containers this
# workflow uses.
#
# A passing run publishes a GitHub pre-release with the packages (deb, rpm,
# a Flatpak bundle and the Windows installer), an SBOM, SHA256SUMS and
# build-provenance attestations. The final release (v0.1.0)
# does not build again: release.yml republishes these files unchanged.
# Because the files are reused, the workspace version in Cargo.toml must
# already be the final version (0.1.0); the suffix lives only in the tag.

name: Pre-release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions: {}

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: false

env:
  # Hosted runners have little memory for parallel rustc jobs.
  CARGO_BUILD_JOBS: 2
  CARGO_TERM_COLOR: always
  TAG: ${{ github.ref_name }}

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Check the tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tag format, version and branch
        id: tag
        run: |
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-(alpha|beta|rc)\.[0-9]+$ ]]; then
            echo "::error::$TAG is not a pre-release tag (expected vX.Y.Z-alpha.N, -beta.N or -rc.N)"
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          workspace=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)
          if [[ "$workspace" != "$version" ]]; then
            echo "::error::Cargo.toml says $workspace, the tag says $version. The final release reuses these packages, so the workspace version must be the final one."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG is not on main. Releases are tagged on main."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux suites (${{ matrix.distro }})
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu-22.04, ubuntu-24.04, debian-12, fedora]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The cargo registry and the pnpm store, as `cargo xtask ci --cache-dir`
      # lays them out. The distribution's target directory is not cached: it
      # is several gigabytes per distribution.
      - name: Cache the cargo registry and the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/ci-cache/cargo-registry
            ${{ runner.temp }}/ci-cache/pnpm-store
          key: containers-${{ matrix.distro }}-${{ hashFiles('Cargo.lock', 'pnpm-lock.yaml') }}
          restore-keys: containers-${{ matrix.distro }}-

      - name: Install the pinned Rust toolchain for the task runner
        run: rustup toolchain install

      - name: Run the default suites in the container
        env:
          DISTRO: ${{ matrix.distro }}
        run: cargo xtask ci --engine docker --distro "$DISTRO" --cache-dir "$RUNNER_TEMP/ci-cache"

  windows:
    name: Windows build, unit tests and installer
    needs: verify
    runs-on: windows-2025
    timeout-minutes: 150
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Enable pnpm at the version package.json names
        run: |
          corepack enable pnpm
          pnpm --version
          echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-windows-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-windows-

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install the UI's dependencies
        run: pnpm install --frozen-lockfile

      # The UI is built first: the desktop app embeds it.
      - name: Build the UI
        run: pnpm build

      - name: UI component tests
        run: pnpm --filter ui exec vitest run

      - name: Build the Rust workspace
        run: cargo build --workspace --locked

      - name: Rust tests
        run: cargo test --workspace --locked

      # The installer carries the command line beside the app: its hooks take
      # glyphkeel.exe from the folder of the app's binary, so both are built
      # with the same profile into the same target folder.
      - name: Build the command line for the installer
        run: cargo build --package gk-cli --profile dist --locked

      # The Tauri CLI runs directly rather than through the package script,
      # whose variable assignments need a POSIX shell. The installer is
      # per-user, embeds the WebView2 bootstrapper and is not signed.
      - name: Build the NSIS installer
        working-directory: ui
        env:
          CI: "true"
          TAURI_APP_PATH: ../crates/gk-app
          TAURI_FRONTEND_PATH: .
        run: pnpm exec tauri build --ci --bundles nsis --config '{"bundle":{"active":true}}' -- --profile dist

      - name: Collect the installer
        run: |
          mkdir -p "$RUNNER_TEMP/windows"
          cp "target/dist/bundle/nsis/Glyphkeel_${VERSION}_x64-setup.exe" "$RUNNER_TEMP/windows/glyphkeel-${VERSION}-x64-setup.exe"
          ls -l "$RUNNER_TEMP/windows"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: ${{ runner.temp }}/windows/
          if-no-files-found: error
          retention-days: 7

  supply-chain:
    name: Dependency licences and advisories
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Install cargo-deny
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny@0.21.0

      - name: cargo-deny
        run: cargo xtask ci --here --suite deny

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # Only what ships: the production dependencies. Development tools never
      # reach users, and their licences and advisories are checked locally.
      - name: Audit the UI's shipped dependencies
        run: |
          corepack enable pnpm
          pnpm audit --prod --audit-level high

  packages:
    name: Build and install the packages
    needs: [verify, linux, windows, supply-chain]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache the cargo registry and the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/ci-cache/cargo-registry
            ${{ runner.temp }}/ci-cache/pnpm-store
          key: containers-ubuntu-22.04-${{ hashFiles('Cargo.lock', 'pnpm-lock.yaml') }}
          restore-keys: containers-ubuntu-22.04-

      - name: Install the pinned Rust toolchain for the task runner
        run: rustup toolchain install

      # Ubuntu 22.04 is the build machine: its glibc is the oldest supported.
      # The suites build the deb and rpm there, then install them in clean
      # containers of every supported distribution and check them with no
      # network: the files and both programs, a command-line session, and
      # the never-online trace of the app, the command line and the MCP
      # server, WebKitGTK's processes included.
      - name: Build the packages and check them installed
        run: cargo xtask ci --engine docker --suite packages,offline --cache-dir "$RUNNER_TEMP/ci-cache"

      # Hosted runners have no GPU and vary in speed, so timings and memory
      # are a record, not a gate: the suite runs without --perf-enforce, and
      # even a failure of the measuring itself doesn't stop the release. The
      # budgets are checked on the reference machine.
      - name: Performance with data set L (report only)
        continue-on-error: true
        run: cargo xtask ci --engine docker --distro ubuntu-24.04 --suite perf --cache-dir "$RUNNER_TEMP/ci-cache"

      - name: Add the performance table to the run summary
        if: always()
        run: |
          table="$RUNNER_TEMP/ci-cache/results/ubuntu-24.04/perf/perf.md"
          if [[ -f "$table" ]]; then
            { echo "## Performance with data set L (report only)"; echo; cat "$table"; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::No performance table was written"
          fi

      - name: Screenshots in the pseudo-locale
        run: cargo xtask ci --engine docker --distro ubuntu-22.04 --suite pseudo --cache-dir "$RUNNER_TEMP/ci-cache"

      - name: Collect the packages
        run: |
          bundle="$RUNNER_TEMP/ci-cache/target-ubuntu-22.04/dist/bundle"
          mkdir -p "$RUNNER_TEMP/packages"
          cp "$bundle/deb/Glyphkeel_${VERSION}_amd64.deb" "$RUNNER_TEMP/packages/glyphkeel_${VERSION}_amd64.deb"
          cp "$bundle/rpm/Glyphkeel-${VERSION}-1.x86_64.rpm" "$RUNNER_TEMP/packages/glyphkeel-${VERSION}-1.x86_64.rpm"
          ls -l "$RUNNER_TEMP/packages"

      - name: Keep the check results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-results
          path: |
            ${{ runner.temp }}/ci-cache/results/
            ${{ runner.temp }}/ci-cache/target-ubuntu-22.04/screenshots/
          if-no-files-found: warn
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: ${{ runner.temp }}/packages/
          if-no-files-found: error
          retention-days: 7

  flatpak:
    name: Build the Flatpak bundle
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      # flatpak-builder-tools, pinned to a commit: the generators of the
      # offline source lists the manifest needs. Their Python dependencies
      # are pinned below to the versions the tools' own lock files name.
      BUILDER_TOOLS_REPO: https://github.com/flatpak/flatpak-builder-tools.git
      BUILDER_TOOLS_COMMIT: 9d86d336a39b9af38b86f114b6ce5820fe260f91
      FLATPAK_DIR: crates/gk-app/packaging/flatpak
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the source list generators
        run: |
          tools="$RUNNER_TEMP/flatpak-builder-tools"
          git init --quiet "$tools"
          git -C "$tools" fetch --quiet --depth 1 "$BUILDER_TOOLS_REPO" "$BUILDER_TOOLS_COMMIT"
          git -C "$tools" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$tools" rev-parse HEAD)" = "$BUILDER_TOOLS_COMMIT"
          python3 -m venv "$RUNNER_TEMP/generators"
          "$RUNNER_TEMP/generators/bin/pip" install --quiet \
            aiohttp==3.13.3 PyYAML==6.0.3 tomlkit==0.13.3
          "$RUNNER_TEMP/generators/bin/pip" install --quiet --no-deps "$tools/node"

      # Every crate and npm package of the lock files, as sources
      # flatpak-builder downloads and checks before the build, which then
      # runs without the network.
      - name: Generate the offline source lists
        run: |
          tools="$RUNNER_TEMP/flatpak-builder-tools"
          "$RUNNER_TEMP/generators/bin/python" "$tools/cargo/flatpak-cargo-generator.py" \
            Cargo.lock -o "$FLATPAK_DIR/cargo-sources.json"
          "$RUNNER_TEMP/generators/bin/flatpak-node-generator" pnpm pnpm-lock.yaml \
            --pnpm-store-version v11 -o "$FLATPAK_DIR/node-sources.json"
          ls -l "$FLATPAK_DIR"

      # flatpak-builder runs its build in a bubblewrap sandbox, which needs
      # unprivileged user namespaces; Ubuntu 24.04 restricts them by default.
      - name: Install flatpak-builder and add Flathub
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends flatpak flatpak-builder
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Install the pinned Rust toolchain for the task runner
        run: rustup toolchain install

      - name: Build the Flatpak
        run: cargo xtask ci --engine docker --suite flatpak --cache-dir "$RUNNER_TEMP/ci-cache"

      - name: Collect the bundle
        run: |
          bundle="$RUNNER_TEMP/ci-cache/flatpak/glyphkeel.flatpak"
          if [[ ! -s "$bundle" ]]; then
            echo "::error::The Flatpak bundle was not built ($bundle is missing)"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/flatpak"
          cp "$bundle" "$RUNNER_TEMP/flatpak/glyphkeel-${VERSION}-x86_64.flatpak"
          ls -l "$RUNNER_TEMP/flatpak"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flatpak
          path: ${{ runner.temp }}/flatpak/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the pre-release
    needs: [verify, packages, flatpak, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: ${{ runner.temp }}/assets

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flatpak
          path: ${{ runner.temp }}/assets

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows
          path: ${{ runner.temp }}/assets

      # The SBOM lists every crate and npm package from the lock files.
      - name: SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: ${{ runner.temp }}/assets/glyphkeel-${{ needs.verify.outputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Checksums
        working-directory: ${{ runner.temp }}/assets
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Build-provenance attestations
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/assets/SHA256SUMS

      # The notes are the version's section of CHANGELOG.md, written before
      # the tag is pushed.
      - name: Release notes
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [[ ! -s "$RUNNER_TEMP/notes.md" ]] || ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::warning::CHANGELOG.md has no section for $VERSION"
            echo "See CHANGELOG.md for the changes in this version." > "$RUNNER_TEMP/notes.md"
          fi

      - name: Create the GitHub pre-release
        run: |
          gh release create "$TAG" \
            --verify-tag \
            --prerelease \
            --title "Glyphkeel $TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "$RUNNER_TEMP"/assets/*
