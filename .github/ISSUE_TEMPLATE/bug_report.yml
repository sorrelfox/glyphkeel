name: Bug report
description: Something in Glyphkeel doesn't work as described.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Please search the
        existing issues first. Security problems must **not** be reported
        here; follow [SECURITY.md](https://github.com/sorrelfox/glyphkeel/blob/dev/SECURITY.md) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps, workspace or file that shows the problem.
      placeholder: |
        1. Open the board of a project
        2. Drag a card to the Done column
        3. …
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: Which part is affected
      multiple: true
      options:
        - Desktop app
        - Command line (glyphkeel)
        - MCP server (glyphkeel mcp)
        - Building from source
        - Documentation
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The output of `glyphkeel --version`, or the commit you built from.
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system and desktop
      placeholder: Fedora 45, GNOME 51, Wayland
    validations:
      required: true
  - type: input
    id: mcp-client
    attributes:
      label: MCP client
      description: If the problem involves MCP, the client and its version.
  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      description: Paste any relevant output. Remove anything private first.
      render: text
