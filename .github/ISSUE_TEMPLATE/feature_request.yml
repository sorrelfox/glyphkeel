name: Feature request
description: Suggest a feature or a change in behaviour.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Glyphkeel is local-only by design: features that need a server, an
        account or a network connection are out of scope.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: The proposal
      description: How you would like it to work. Mention the app, the command line and MCP where they are affected.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways to solve it, or how other tools handle it.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues and didn't find this request.
          required: true
