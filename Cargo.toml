[workspace]
resolver = "3"
members = ["crates/*", "tools/*", "xtask"]
# `cargo build` and `cargo test` without `-p` skip the task runner and the
# development tools in `tools/`.
default-members = ["crates/*"]
# The fuzz targets build on nightly with cargo-fuzz, apart from the rest.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.8"
edition = "2024"
# Keep equal to the channel in rust-toolchain.toml and `msrv` in clippy.toml.
rust-version = "1.100"
license = "GPL-3.0-or-later"
repository = "https://github.com/sorrelfox/glyphkeel"
publish = false

[workspace.dependencies]
# Internal crates are added here as path dependencies when a crate first uses
# another, for example `gk-core = { path = "crates/gk-core" }`. Which crate may
# use which is checked by `cargo xtask check-deps`.
gk-api = { path = "crates/gk-api" }
gk-core = { path = "crates/gk-core" }
gk-engine = { path = "crates/gk-engine" }
gk-markdown = { path = "crates/gk-markdown" }
gk-mcp = { path = "crates/gk-mcp" }
gk-query = { path = "crates/gk-query" }
gk-store = { path = "crates/gk-store" }
# The test-data tool, for engine tests that import its data sets.
gk-seed = { path = "tools/seed" }

# Third-party crates: shared versions live here, crates use `{ workspace = true }`.
# Every new crate needs a reason in a comment and a licence that cargo-deny allows.
anyhow = "1.0.105"
# Command line of `glyphkeel` and of the task runner.
clap = { version = "4.6.9", features = ["derive"] }
# Shell completions and the man page of `glyphkeel`.
clap_complete = "4.6.12"
clap_mangen = "0.3.4"
# The platform's folders (data, config) for the default workspace.
directories = "6.0.0"
# Unicode case folding and normalisation for the `*_fold` matching columns.
icu_casemap = "2.4.0"
icu_normalizer = "2.4.0"
# The Unicode Collation Algorithm for sorting names, registered on every
# database connection.
icu_collator = "2.4.0"
# The MCP server of `glyphkeel mcp`: both protocol eras over standard input
# and output. The minor version is pinned because it ships protocol fixes
# often; read its changelog on every bump. The `client` feature is used by
# tests only. `elicitation` asks the person to confirm in the old era;
# the Streamable HTTP server serves the opt-in local endpoint.
rmcp = { version = "~3.11.0", default-features = false, features = ["server", "transport-io", "elicitation", "transport-streamable-http-server"] }
# Snapshots of command output in tests (development only).
insta = "1.49.0"
# Thumbnails of attached images. Only the decoders for the image types the
# app shows (PNG, JPEG, GIF, WebP); PNG also writes the thumbnails.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# Property tests (development only).
proptest = "1.12.0"
# Time zones: the local day of a moment and the moment of a local time, for
# "today", reminders and the time report. Reads the system's zone database;
# `tzdb-bundle-always` embeds a copy that is used only when the system has
# none (a minimal install without tzdata), instead of silently using UTC.
jiff = { version = "1.0.2", features = ["tzdb-bundle-always"] }
# The workspace database: SQLite bundled (with FTS5), custom collation and
# busy handler; the online backup API restores a snapshot into the open
# database. The bundled SQLite is SQLCipher's, for encrypted workspaces; it
# opens plain ones as SQLite does. Its cryptography is the system's OpenSSL
# (libcrypto) on Linux. Windows builds keep plain SQLite (see
# crates/gk-store/Cargo.toml).
rusqlite = { version = "0.43.0", features = ["collation", "backup"] }
# The key of an encrypted workspace from its passphrase: PBKDF2-HMAC-SHA512,
# as SQLCipher derives it (hmac and sha2 0.10 were in the lock already).
pbkdf2 = { version = "0.12.2", default-features = false, features = ["hmac"] }
# Wiping passphrases and keys from memory (already in the lock).
zeroize = "1.9.2"
# Asking for a passphrase on the terminal without echo (the command line).
rpassword = "7.4.0"
# The operation catalog's JSON Schemas (inputs, outputs, the MCP tool list
# and the generated TypeScript client).
schemars = "1.2.3"
# Records of the test-data archive written by the seed tool, and every
# operation's input and output.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# The JSON path of the field that made an operation's input invalid.
serde_path_to_error = "0.1.20"
# Content hashes of stored files (files are addressed by SHA-256).
sha2 = "0.10.9"
# Temporary workspaces in tests (development only).
tempfile = "3.27.0"
# Markdown: the parser and HTML renderer of `gk-markdown` (CommonMark, GFM and
# the extensions). Pinned to the minor version: before 1.0 its option names
# change between minors.
comrak = { version = "~0.59.0", default-features = false }
# The final allowlist on the reader's HTML in `gk-markdown`.
ammonia = "4.2.5"
# Regular expressions in tests only (the allowlist checker of `gk-markdown`).
regex = "1.13.2"
# Spelling in the Markdown editor: a Rust port of Hunspell that reads the
# system's Hunspell dictionaries (MPL-2.0).
spellbook = "=0.4.2"
# Line diffs for the three-way merge of descriptions and the differences
# between two revisions (already in the lock through insta).
similar = { version = "2.7.0", default-features = false, features = ["text"] }
# The licence policy of the third-party notices, read by the task runner only
# (already in the lock through Tauri).
toml = "1.2.2"
# Error types.
thiserror = "2.0.21"
# Structured logs (slow write transactions, checkpoints).
tracing = "0.1.44"
# The desktop app. Tauri 2 is pinned exactly and bumped deliberately, together
# with `@tauri-apps/api` in ui/package.json.
tauri = "=2.12.7"
tauri-build = "=2.7.6"
# The Windows resources of the command line: manifest, icon and version
# (already in the lock through tauri-build).
embed-resource = "=3.0.12"
# The GTK bindings Tauri itself uses, for the window's title bar, bringing it
# forward with an activation token, and its remembered geometry (Linux only).
gtk = "=0.18.2"
# The session bus: a second start of the app hands its links and activation
# token to the running one (Linux only).
zbus = "5.19.0"
# The quick-add shortcut through the desktop's GlobalShortcuts portal, on
# Wayland and wherever the desktop offers it, and the Background portal for
# starting with the system inside Flatpak (Linux only).
ashpd = { version = "=0.13.13", default-features = false, features = ["async-io", "background", "global_shortcuts"] }
# The quick-add shortcut on X11, and on KWin's Wayland session through
# XWayland, where the portal is not used.
tauri-plugin-global-shortcut = "=2.4.1"
# The WebKitGTK bindings Tauri itself uses, to switch off web-view features
# the app never needs (Linux only).
webkit2gtk = "=2.0.2"
# The app's desktop integration on Windows. The page gets no commands or
# scripts from them: only the single-instance plugin is registered, and it
# has none; the others are called from Rust.
# - A second start hands its arguments to the running app, which may then
#   come forward.
tauri-plugin-single-instance = "=2.5.5"
# - Links and attached files open in their default programs.
tauri-plugin-opener = "=2.5.4"
# - Reminders as toasts, whose click opens the task.
tauri-winrt-notification = "=0.8.1"
# - The system's file and folder choosers and its message box (TaskDialog).
rfd = { version = "=0.16.1", default-features = false, features = ["common-controls-v6"] }
# The registry on Windows: starting with the system through the person's
# `Run` key, and the person's `PATH` for the command-line tool's status
# (already in the lock through tauri-build).
winreg = "=0.56.0"
# The async runtime: the MCP server uses only the single-threaded parts; the
# development bridge adds its own features in its manifest.
tokio = { version = "1.54.1", default-features = false, features = ["rt", "time", "macros"] }
# The local HTTP endpoint for agents (off by default, 127.0.0.1 only): the
# HTTP/1 server under rmcp's Streamable HTTP service, its body helpers and
# the service trait. All were in the lock already through Tauri's
# dependencies.
hyper = { version = "1.12.0", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
http-body-util = "0.1.5"
bytes = "1.12.2"
tower-service = "0.3.3"
# Stopping the MCP server's watchers and its HTTP endpoint.
tokio-util = { version = "0.7.20", default-features = false }
# Secrets from the system's random source: the HTTP endpoint's token and the
# request states of confirmations.
getrandom = "0.3.4"
# Log lines of `glyphkeel mcp` on standard error (standard output carries the
# protocol).
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
# The development bridge only (tools/devbridge, never in a release): its
# async runtime, its loopback WebSocket server and stream helpers. The
# WebSocket crates are built without TLS.
tokio-tungstenite = { version = "0.28.0", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
# Export archives: reading and writing `.zip` files. Only the deflate method
# (through flate2, already in the lock), no encryption or other codecs.
zip = { version = "9.8.1", default-features = false, features = ["deflate-flate2"] }
# IDs: UUIDv7.
uuid = { version = "1.29.3", features = ["v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
print_stdout = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

# Release artifacts: fat LTO and stripped symbols. Day-to-day release builds
# keep the faster thin-LTO profile above.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
debug = false
strip = "symbols"

# Dependencies are optimised a little in debug builds, so the app and the
# engine stay usable while our own code keeps fast incremental builds.
[profile.dev.package."*"]
opt-level = 1
