[package]
name = "gk-devbridge"
description = "Development tool: the engine's operations and change events over a loopback WebSocket, so the web UI runs in a browser against a real workspace. Never part of a release."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "gk-devbridge"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
futures-util = { workspace = true }
gk-api = { workspace = true }
gk-engine = { workspace = true }
gk-store = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "sync"] }
tokio-tungstenite = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["time"] }

[lints]
workspace = true
